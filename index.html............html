<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

<style>
  body,h1,h2,h3 {margin: 0; padding: 0;}

  body{background-color: #004d4d;   
      color: #ffffff;              
      font-family: 'Barlow Condensed', sans-serif;
      height: 100vh;               
      position: relative; }
 
nav {
      display: flex;              
      justify-content: center;     
      gap: 80px;                   
      padding: 28px 0;            
    }

    
    nav a {
      color: #e0f0f0;             
      text-decoration: none;       
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.02em;
      text-transform: lowercase;   
      transition: color 0.25s ease;
    }

    nav a:hover {
      color: #ffffff;             
    }

    .brand-text {
      position: absolute;          
      bottom: -0.12em;             
      left: 50%;                   
      transform: translateX(-50%); 
      white-space: nowrap;         

      font-size: clamp(80px, 14.5vw, 220px); 
      font-weight: 800;
      letter-spacing: -0.03em;     
      line-height: 1;

      color: #ffffff;
    }




</style>

  <title>

    fastrend
  </title>
</head>
<body>
  <nav>
    <a href="#">why?</a>
    <a href="#">how?</a>
    <a href="#">buy</a>
  </nav>

  
  <h1 class="brand-text">FasTrend</h1>


</body>
</html>
